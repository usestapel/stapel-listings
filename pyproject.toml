[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-listings"
version = "0.22.7"
description = "Listings and catalog for the Stapel framework"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "stapel", "listings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    # Floor: the core this app is developed and tested against. The old
    # `>=0.10` let a consumer resolve a core the app has not seen in a year.
    #
    # 0.60.6 is the floor because ListingDraftSerializer.validate() raises
    # StapelValidationError(..., params={"max_bytes": ...}) — a
    # serializer-level `.validate()` — and before core 0.60.6, DRF's own
    # Serializer.run_validation catches and re-raises that as a plain
    # ValidationError, discarding `params` along the way; a client below the
    # floor never sees `max_bytes`.
    #
    # 0.60.8 moves it again, for a different reader: `catalog_search_dirs()`
    # walks the package directory of every registered error owner, not only
    # INSTALLED_APPS. `errors.py` puts thirteen `stapel_attributes`-owned codes
    # into the registry of every host that mounts this module, and
    # stapel-attributes is an embedded library with no Django app — a host
    # never lists it. On 0.60.6/0.60.7 the loader therefore could not reach the
    # catalogue that wheel ships, however complete it was, and those codes
    # rendered their English floor on an otherwise translated screen.
    # `tests/test_error_i18n.py` is the gate.
    "stapel-core>=0.60.8,<1.0",
    # attributes 0.3.x caps `stapel-core<0.12`, which made stapel-listings
    # unresolvable next to any modern core (stapel-categories 0.5.4 hit the
    # same wall and moved the same way).
    # Floor: 0.7 is where `select` finally snapshots its display copy.
    # `SelectFeatureType.dto_to_dao` now fills `SelectDao.labels` from the
    # chosen options, positionally aligned with `value`, exactly the way
    # `RefSelectDao` has carried `labels` since 0.5. That matters here more
    # than anywhere else, because the DAO *is* the projection: a card renders
    # `features_badges` and a detail page renders `features` without ever
    # fetching the category, which is the entire reason those columns exist.
    # Under 0.6 a stored `select` carried option values and nothing else, so
    # every one of those readers printed the storage slug at a person —
    # "Condition: b-u", "Sensors: gps", "Screen condition: bez-defektov" — and
    # no reader could repair it, because the copy was lost at WRITE time and
    # the projection is deliberately the only thing a reader has. So the floor
    # moves with the cap, the same way it did in 0.10.2: a deployment able to
    # resolve back onto 0.6 is a deployment whose listing projections silently
    # lose their display copy again, on the next publish, with nothing red
    # anywhere to say so.
    # Cap: <0.8, not <1.0. Pre-1.0 house semver reads a MINOR as breaking, and
    # this line was the exception that proved it — a published stapel-attributes
    # can add a built-in type, which changes the discriminator mapping this
    # module emits into docs/schema.json, and an unbounded cap let 0.6.0 turn
    # tests/test_contract.py red with nothing here having changed.
    # <0.10 as of stapel-listings 0.17.1: stapel-attributes 0.9.0 changes one
    # rule semantic — `in` / `not_in` no longer match a controller that reads
    # EMPTY, so a `require when X not_in [...]` stops demanding an answer
    # before anyone has answered X. This module EVALUATES rules (the publish
    # gate reads `RuleState.required`), so the new semantic reaches it: a
    # draft that used to be refused for a field nobody could have known to
    # fill now publishes. That is the point of the release, and the suite is
    # green on 0.9.0 unchanged.
    #
    # Floor 0.9.3 is about the OTHER half of what this module imports from
    # here. `errors.py` re-exports this library's error CODES into the host's
    # registry on purpose — the draft/publish path returns them at the top
    # level of a refusal, so a consumer that did not see them could not render
    # the errors a seller is most likely to hit. The strings for those codes
    # are upstream's to own and upstream's to ship, and 0.9.3 is the first
    # wheel that actually contains them (`translations/errors.{ru,es}.json`,
    # all thirteen keys): 0.8.1 through 0.9.2 ship `errors.py` and no
    # `translations/` directory at all. Pinning the floor here is how the
    # strings travel with the codes without this package copying them — a copy
    # would be an `error`-level `foreign` issue in core's catalogue gate and a
    # second, drifting version of somebody else's wording. (0.9.3 itself
    # requires `stapel-core>=0.60.8`, so the two floors above are one
    # decision; both are stated because the reason differs.)
    "stapel-attributes>=0.9.3,<0.10",
    "djangorestframework>=3.14",
    "djangorestframework-dataclasses>=1.2",
    "drf-spectacular>=0.27",
]

[project.urls]
Homepage = "https://github.com/usestapel/stapel-listings"
Repository = "https://github.com/usestapel/stapel-listings"
Documentation = "https://github.com/usestapel/stapel-listings#readme"
Changelog = "https://github.com/usestapel/stapel-listings/blob/main/CHANGELOG.md"
Issues = "https://github.com/usestapel/stapel-listings/issues"

[project.optional-dependencies]
all = []

[tool.setuptools]
package-dir = {"stapel_listings" = "."}
packages = [
    "stapel_listings",
    "stapel_listings.migrations",
    "stapel_listings.services",
    "stapel_listings.management",
    "stapel_listings.management.commands",
]

[tool.setuptools.package-data]
stapel_listings = ["py.typed", "migrations/*.py", "schemas/**/*.json", "docs/capabilities.json", "docs/llms.txt", "docs/schema.json", "docs/flows.json", "docs/errors.json", "CONFIG.MD"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Single source for the git hooks and CI (they pass the same flags on the CLI).
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
django_find_project = false
addopts = "--tb=short -q --import-mode=importlib"

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/migrations/*",
]
